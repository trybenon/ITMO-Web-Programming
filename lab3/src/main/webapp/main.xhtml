<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <h:outputStylesheet library="css" name="style.css"/>
            <title>lab3|main</title>
</h:head>

<h:body>

    <div class="canvas-container">
        <canvas id="graphCanvas" width="300" height="300" style="cursor: pointer; border: 1px solid #ccc; background-color: white;"></canvas>
    </div>

    <h:form id="valForm" method="GET">
        <div id="xForm">
            <label>Выберите X:</label>
            <h:selectOneMenu id="x" value="#{attemptBean.point.x}">
                <f:selectItem itemValue="-2.0" itemLabel="-2.0"/>
                <f:selectItem itemValue="-1.5" itemLabel="-1.5"/>
                <f:selectItem itemValue="-1.0" itemLabel="-1.0"/>
                <f:selectItem itemValue="-0.5" itemLabel="-0.5"/>
                <f:selectItem itemValue="0.0" itemLabel="0.0"/>
                <f:selectItem itemValue="0.5" itemLabel="0.5"/>
                <f:selectItem itemValue="1.0" itemLabel="1.0"/>
                <f:selectItem itemValue="1.5" itemLabel="1.5"/>
                <f:selectItem itemValue="2.0" itemLabel="2.0"/>
            </h:selectOneMenu>
        </div>
        <div id="yForm">
            <h:inputText id="y" value="#{attemptBean.point.y}" placeholder="Введите значение от -2 до 2"/>
        </div>
        <div id="rForm">
            <h:inputText id="r" value="#{attemptBean.point.r}" placeholder="Введите значение от -2 до 2"/>
        </div>
        <h:commandButton id="submit" value="Отправить" action="#{attemptBean.buildResult()}"> </h:commandButton>
    </h:form>



    <h:form id="hiddenForm" style="display:none;">
        <h:inputHidden id="hiddenX" value="#{attemptBean.point.x}" />
        <h:inputHidden id="hiddenY" value="#{attemptBean.point.y}" />
        <h:inputHidden id="hiddenR" value="#{attemptBean.point.r}" />
        <h:commandButton id="sendBtn" action="#{attemptBean.buildResult()}" />
    </h:form>

    <p:dataTable value="#{storageBean.results}" var="r"
                 paginator="true" rows="10"
                 paginatorPosition="bottom"
                 rowsPerPageTemplate="5,10,15"
                 sortMode="single"
                 stripedRows="true">


        <p:column headerText="ID" sortBy="#{r.id}">
            <h:outputText value="#{r.id}" />
        </p:column>

        <p:column headerText="X" sortBy="#{r.x}">
            <h:outputText value="#{r.x}" />
        </p:column>

        <p:column headerText="Y" sortBy="#{r.y}">
            <h:outputText value="#{r.y}" />
        </p:column>

        <p:column headerText="R" sortBy="#{r.r}">
            <h:outputText value="#{r.r}" />
        </p:column>


        <p:column headerText="Результат" sortBy="#{r.success}">
            <h:outputText value="#{r.success ? 'ПОПАЛ' : 'ПРОМАХ'}"
                          style="color: #{r.success ? 'green' : 'red'}; font-weight: bold;" />
        </p:column>


        <p:column headerText="Время попытки" sortBy="#{r.attemptTime}">
            <h:outputText value="#{r.attemptTime}">

                <f:convertDateTime pattern="HH:mm:ss" type="zonedDateTime"/>
            </h:outputText>
        </p:column>

        <p:column headerText="Время выполнения">
            <h:outputText value="#{r.execTime} мс" />
        </p:column>

    </p:dataTable>
    <h:outputScript library="js" name="script.js"/>
</h:body>

</html>
